<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Bán Hàng</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased">

<div class="flex h-screen overflow-hidden">

    <!-- SIDEBAR BÊN TRÁI -->
    <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="h-16 flex items-center px-6 border-b border-gray-800">
                <h1 class="font-bold text-xs tracking-wider uppercase text-indigo-400">HỆ THỐNG QUẢN LÝ BÁN HÀNG</h1>
            </div>
            <nav class="p-4 space-y-1">
                <a href="/index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-600 text-white font-medium transition"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
                <a href="/products.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-box w-5"></i> Products</a>
                <a href="/categories.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-tags w-5"></i> Categories</a>
                <a href="/customers.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-users w-5"></i> Customers</a>
                <a href="/orders.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Orders</a>
                <a href="/order-details.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-list-check w-5"></i> OrderDetail</a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-800 text-xs text-gray-500 text-center">
            Spring Boot Backend connected
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <!-- TOPBAR -->
        <header class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-6 z-10">
            <div class="text-sm font-semibold text-gray-300">Tổng quan hệ thống</div>
            <div class="flex items-center gap-3 bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700">
                <div class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-user text-sm"></i>
                </div>
                <span class="text-sm font-medium text-gray-200">Admin</span>
            </div>
        </header>

        <!-- DASHBOARD BODY -->
        <main class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-950">

            <!-- 4 Ô THỐNG KÊ (Products, Customers, Orders, Revenue) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-semibold">Products</p>
                        <h3 id="stat-products" class="text-2xl font-bold mt-1 text-white">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-box"></i>
                    </div>
                </div>
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-semibold">Customers</p>
                        <h3 id="stat-customers" class="text-2xl font-bold mt-1 text-white">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-purple-500/10 text-purple-400 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-users"></i>
                    </div>
                </div>
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-semibold">Orders</p>
                        <h3 id="stat-orders" class="text-2xl font-bold mt-1 text-white">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                    </div>
                </div>
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-semibold">Revenue</p>
                        <h3 id="stat-revenue" class="text-2xl font-bold mt-1 text-emerald-400">0đ</h3>
                    </div>
                    <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-dollar-sign"></i>
                    </div>
                </div>
            </div>

            <!-- KHU VỰC BIỂU ĐỒ DOANH THU THEO THÁNG -->
            <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl">
                <h3 class="text-base font-semibold mb-4 text-gray-200">Doanh thu theo tháng</h3>
                <div class="relative h-64 w-full">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>

            <!-- KHU VỰC ĐƠN HÀNG GẦN ĐÂY -->
            <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl">
                <h3 class="text-base font-semibold mb-4 text-gray-200">Đơn hàng gần đây</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                        <tr class="border-b border-gray-800 text-xs text-gray-400 uppercase">
                            <th class="py-3 px-4">Mã đơn</th>
                            <th class="py-3 px-4">Khách hàng</th>
                            <th class="py-3 px-4">Tổng tiền</th>
                            <th class="py-3 px-4">Trạng thái</th>
                        </tr>
                        </thead>
                        <tbody id="recent-orders-table" class="divide-y divide-gray-800/60 text-sm">
                        <!-- Dữ liệu fetch từ API backend -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- Dashboard JS kết nối Backend -->
<script src="/jss/dashboard.js"></script>
</body>
</html>
