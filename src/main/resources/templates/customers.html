<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Khách Hàng - Hệ Thống Quản Lý Bán Hàng</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/customers.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased">

<div class="flex h-screen overflow-hidden">

    <!-- SIDEBAR BÊN TRÁI -->
    <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="h-16 flex items-center px-6 border-b border-gray-800">
                <h1 class="font-bold text-xs tracking-wider uppercase text-indigo-400">HỆ THỐNG QUẢN LÝ BÁN HÀNG</h1>
            </div>
            <nav class="p-4 space-y-1">
                <a href="/index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
                <a href="/products.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-box w-5"></i> Products</a>
                <a href="/categories.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-tags w-5"></i> Categories</a>
                <a href="/customers.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-600 text-white font-medium transition"><i class="fa-solid fa-users w-5"></i> Customers</a>
                <a href="/orders.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Orders</a>
                <a href="/order-details.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-list-check w-5"></i> OrderDetail</a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-800 text-xs text-gray-500 text-center">
            Spring Boot Backend connected
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <!-- TOPBAR -->
        <header class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-6 z-10">
            <div class="text-sm font-semibold text-gray-300">Khách hàng</div>
            <div class="flex items-center gap-3 bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700">
                <div class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-user text-sm"></i>
                </div>
                <span class="text-sm font-medium text-gray-200">Admin</span>
            </div>
        </header>

        <!-- PAGE CONTENT -->
        <main class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-950">

            <!-- Tiêu đề & Nút Thêm + Tìm kiếm -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-900 p-5 rounded-2xl border border-gray-800">
                <h2 class="text-xl font-bold text-white">Danh sách khách hàng</h2>

                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <!-- Ô tìm kiếm -->
                    <div class="relative flex-1 sm:w-64">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-magnifying-glass text-sm"></i>
                        </span>
                        <input type="text" id="search-input" placeholder="Tìm khách hàng..."
                               class="w-full bg-gray-950 border border-gray-800 rounded-xl pl-10 pr-4 py-2 text-sm text-gray-200 focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <!-- Nút Thêm -->
                    <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl text-sm transition flex items-center gap-2 whitespace-nowrap shadow-lg shadow-indigo-600/20">
                        <i class="fa-solid fa-plus"></i> Thêm
                    </button>
                </div>
            </div>

            <!-- BẢNG HIỂN THỊ DỮ LIỆU KHÁCH HÀNG -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                        <tr class="border-b border-gray-800 text-xs text-gray-400 uppercase bg-gray-950/40">
                            <th class="py-4 px-6">Tên</th>
                            <th class="py-4 px-6">SĐT</th>
                            <th class="py-4 px-6">Email</th>
                            <th class="py-4 px-6">Địa chỉ</th>
                            <th class="py-4 px-6 text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="customers-table-body" class="divide-y divide-gray-800/60 text-sm">
                        <tr>
                            <td colspan="5" class="py-8 text-center text-gray-500">Đang tải dữ liệu khách hàng...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- MODAL THÊM / SỬA KHÁCH HÀNG -->
<div id="customer-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-md p-6 space-y-5 shadow-2xl">
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h3 id="modal-title" class="text-lg font-bold text-white">Thêm khách hàng mới</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <form id="customer-form" onsubmit="saveCustomer(event)" class="space-y-4">
            <input type="hidden" id="customer-id">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Tên khách hàng</label>
                <input type="text" id="customer-name" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Số điện thoại</label>
                    <input type="text" id="customer-phone" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Email</label>
                    <input type="email" id="customer-email" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Địa chỉ</label>
                <input type="text" id="customer-address" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex justify-end gap-3 pt-3 border-t border-gray-800">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium bg-gray-800 hover:bg-gray-700 text-gray-300 transition">Hủy</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-lg shadow-indigo-600/20">Lưu khách hàng</button>
            </div>
        </form>
    </div>
</div>

<!-- Kết nối file JS riêng biệt -->
<script src="/jss/customers.js"></script>
</body>
</html>
