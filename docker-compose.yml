services:
  db:
    image: mysql:8.0
    container_name: sale_management_db
    restart: always
    environment:
      MYSQL_DATABASE: sale_management
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sale-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: htquanlybanhang_app
    restart: always
    ports:
      - "6699:6699"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/sale_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root123
      - SERVER_PORT=6699
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sale-network

volumes:
  mysql_data:

networks:
  sale-network:
    driver: bridge